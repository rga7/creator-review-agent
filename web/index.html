<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Creator Submission Review Agent</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --me:#2b6cb0; --bot:#232833;
          --text:#e6e8ee; --muted:#9aa4b2; --accent:#5ce1a6; --warn:#f2b84b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text); height:100vh; display:flex; }
  .chat { flex:1; display:flex; flex-direction:column; max-width:760px; margin:0 auto; min-width:0; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:16px; } header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; }
  .user { align-self:flex-end; background:var(--me); white-space:pre-wrap; }
  .bot  { align-self:flex-start; background:var(--bot); border:1px solid var(--line); }
  .err  { align-self:center; color:var(--warn); font-size:13px; }
  .bot p { margin:0 0 10px; } .bot p:last-child { margin-bottom:0; }
  .bot ul { margin:0 0 10px; padding-left:20px; } .bot ul:last-child { margin-bottom:0; }
  .bot strong { color:#fff; }
  form { display:flex; gap:8px; padding:16px 20px; border-top:1px solid var(--line); }
  input { flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
          background:var(--panel); color:var(--text); font-size:15px; }
  button { padding:11px 18px; border:0; border-radius:10px; background:var(--accent);
           color:#08130d; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:400; }
  aside { width:300px; border-left:1px solid var(--line); background:var(--panel);
          padding:20px; overflow-y:auto; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .phase { font-size:15px; font-weight:600; color:var(--accent); margin-bottom:14px; }
  pre { font-size:12px; color:var(--muted); white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
  <div class="chat">
    <header>
      <h1>Creator Submission Review Agent</h1>
      <p>Test harness. Try: "I'm @maya.makes, Maya Okafor, maya@example.com. Why was my tea video flagged?"</p>
    </header>
    <div id="log"></div>
    <form id="f">
      <input id="in" placeholder="Type a message…" autocomplete="off" maxlength="2000" />
      <button id="send">Send</button>
      <button type="button" class="ghost" id="reset">Reset</button>
    </form>
  </div>
  <aside>
    <h2>Phase</h2>
    <div class="phase" id="phase">VERIFY_ID</div>
    <h2>Live memory</h2>
    <pre id="mem">{}</pre>
  </aside>

<script>
let sid = null;
const log = document.getElementById('log');
const mem = document.getElementById('mem');
const phaseEl = document.getElementById('phase');
const sendBtn = document.getElementById('send');

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Escape first; allow only bold, bullets, paragraphs.
function renderMarkdown(raw) {
  const withBold = escapeHtml(raw).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return withBold.split(/\n\s*\n/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^\s*-\s+/.test(l) || l.trim() === '')) {
      return '<ul>' + lines.filter(l => l.trim())
        .map(l => '<li>' + l.replace(/^\s*-\s+/, '') + '</li>').join('') + '</ul>';
    }
    return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function add(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  if (who === 'bot') d.innerHTML = renderMarkdown(text); else d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function note(text) {
  const d = document.createElement('div');
  d.className = 'err';
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

async function send(text) {
  add(text, 'user');
  sendBtn.disabled = true;
  try {
    const r = await fetch('/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ session_id: sid, message: text })
    });
    if (!r.ok) {
      let detail = 'Something went wrong (' + r.status + ').';
      try { detail = (await r.json()).detail || detail; } catch (_) {}
      const wait = r.headers.get('Retry-After');
      note(detail + (wait ? ' Try again in ' + wait + 's.' : ''));
      return;
    }
    const data = await r.json();
    sid = data.session_id;   // the server may issue a new id if the old one expired
    add(data.reply, 'bot');
    phaseEl.textContent = data.phase + (data.verified ? '  ✓ verified' : '');
    mem.textContent = JSON.stringify(data.memory, null, 2);
  } catch (e) {
    note('Could not reach the server.');
  } finally {
    sendBtn.disabled = false;
  }
}

document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const el = document.getElementById('in');
  const v = el.value.trim();
  if (v) { send(v); el.value = ''; }
});
document.getElementById('reset').addEventListener('click', async () => {
  await fetch('/reset', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ session_id: sid })});
  sid = null; log.innerHTML = ''; mem.textContent = '{}'; phaseEl.textContent = 'VERIFY_ID';
});
</script>
</body>
</html>
